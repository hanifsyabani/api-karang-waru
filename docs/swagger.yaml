basePath: /api/karang-waru
definitions:
  requests.SubLayananRequest:
    properties:
      aktif:
        type: boolean
      layanan_desa_id:
        type: integer
      nama:
        type: string
      persyaratan:
        type: string
      template:
        type: string
    required:
    - layanan_desa_id
    - nama
    type: object
  responses.APIResponse:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
    type: object
host: eventual-alika-karang-waru-aabb0b75.koyeb.app
info:
  contact: {}
  description: API Desa Karang Waru
  title: Karang Waru API
  version: "1.0"
paths:
  /sub-service:
    get:
      description: Ambil daftar sub layanan (pagination & filter)
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Layanan Desa ID
        in: query
        name: layanan_desa_id
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Limit per page
        in: query
        name: limit
        type: integer
      - description: Sort by field
        in: query
        name: sort_by
        type: string
      - description: asc / desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all sub layanan
      tags:
      - Sub Layanan
    post:
      consumes:
      - application/json
      description: Membuat sub layanan baru
      parameters:
      - description: Sub Layanan Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.SubLayananRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.APIResponse'
      security:
      - BearerAuth: []
      summary: Create sub layanan
      tags:
      - Sub Layanan
  /sub-service/{id}:
    put:
      consumes:
      - application/json
      description: Update sub layanan berdasarkan ID
      parameters:
      - description: Sub Layanan ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.SubLayananRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.APIResponse'
      security:
      - BearerAuth: []
      summary: Update sub layanan
      tags:
      - Sub Layanan
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
